<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Line illustration of a single-use syringe">
  <rect width="640" height="400" fill="#F7F5F2"/>
  <g fill="none" stroke="#7A1F2B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- barrel -->
    <rect x="178" y="152" width="258" height="96" rx="8"/>
    <!-- finger flange -->
    <path d="M436 132 L436 268"/>
    <!-- plunger rod -->
    <path d="M436 200 L556 200"/>
    <path d="M556 164 L556 236"/>
