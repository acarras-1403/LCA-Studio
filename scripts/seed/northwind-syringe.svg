    <path d="M214 160 L214 184"/>
    <path d="M250 160 L250 176"/>
    <path d="M286 160 L286 184"/>
    <path d="M322 160 L322 176"/>
    <path d="M358 160 L358 184"/>
    <path d="M394 160 L394 176"/>
